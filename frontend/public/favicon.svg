<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Background -->
  <rect width="120" height="100" rx="22" fill="#0f172a"></rect>

  <!-- Glow effect -->
  <circle cx="50" cy="50" r="24" fill="#1e293b"></circle>

  <!-- Accent gradient ring -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"></stop>
      <stop offset="100%" stop-color="#f97316"></stop>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="20" fill="none" stroke="url(#grad)" stroke-width="3"></circle>

  <!-- Letter -->
  <text x="50" y="57" text-anchor="middle" fill="#facc15" font-size="22" font-weight="600" font-family="Poppins">
    S
  </text>
</svg>